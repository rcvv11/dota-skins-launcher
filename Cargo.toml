[package]
name = "dota-skins-launcher"
version = "0.1.0"
edition = "2021"
description = "Lightweight local cosmetics launcher for Dota 2 (file-based overrides, optional in-memory mode via modelSwap.dll)"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq = "2"
# reads glTF models exported by Source2Viewer-CLI for the 3D preview
gltf = "1.4"
# native "open file / folder" dialogs for attaching own files to items
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
